<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>About Us - Volunteer Portal</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .about-page {
            padding: 30px 0;
        }

        .about-header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
        }

        .about-header h1 {
            color: #287a73;
            margin-bottom: 10px;
        }

        .about-header p {
            color: #666;
        }

        .people {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .person {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            min-height: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }

        .person-photo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dfe9e5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3d8b70;
            font-size: 35px;
        }

        .person h2 {
            color: #287a73;
            margin-bottom: 10px;
        }

        .person p {
            color: #666;
            line-height: 1.6;
        }

        @media(max-width: 800px) {

            .people {
                grid-template-columns: 1fr;
            }

        }

        #selfpromotion {
            color: #666;
            border: 1px black solid;
            border-radius: 10px;
            padding: 5px;
        }
        #selfpromotion:hover {
            transform: scale(1.1);
        }

    </style>

</head>

<body>

<div class="wrapper">

    <nav>

        <a href="index.html">
            <button>HOME</button>
        </a>

        <a href="about.html">

            <button>PROVIDE VOLUNTEERING</button>
        </a>

        <a href="signin.html">
            <button>SIGN IN</button>
        </a>

    </nav>


    <main class="about-page">

        <section class="about-header">

            <h1>
                About Us
            </h1>

            <p>
                Meet the people behind the Volunteer Portal.
            </p>

        </section>

                <h2>

                <p>

                </p>
                <a id='selfpromotion' href='https://github.com/Chicken-Nugget-N'>CLICK ME!!!</a>
            </article>


            <!-- PERSON 2 -->

            <article class="person">

                </p>

            </article>


        </section>

    </main>

</div>

</body>

</html>
