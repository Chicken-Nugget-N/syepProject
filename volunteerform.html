<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Volunteers - Volunteer Portal</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .form-page {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 850px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }

        .form-page h1 {
            color: #287a73;
            margin-bottom: 10px;
        }

        .form-page > p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-button {
            background: #3d8b70;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-button:hover {
            background: #287a73;
        }

        .form-note {
            background: #eef6f2;
            color: #42675a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        @media(max-width: 650px) {

            .form-page {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>

<body>

<div class="wrapper">

    <nav>

        <a href="index.html">
            <button>HOME</button>
        </a>

        <a href="about.html">
            <button>ABOUT US</button>
        </a>

        <a href="volunteerform.html">
            <button>REQUEST VOLUNTEERS</button>
        </a>

        <a href="signin.html">
            <button>SIGN IN</button>
        </a>

    </nav>


    <main class="form-page">

        <h1>
            Submit a Volunteering Opportunity
        </h1>

        <p>
            Have an organization that needs volunteers?
            Add information about your opportunity below.
        </p>


        <div class="form-note">

            This form is currently a project demonstration
            and does not submit information to a database.

        </div>


        <form onsubmit="return false;">

            <div class="form-group">

                <label for="organization">
                    Organization Name
                </label>

                <input
                    id="organization"
                    type="text"
                    placeholder="Example: Community Food Bank"
                >

            </div>


            <div class="form-group">

                <label for="opportunity">
                    Opportunity Name
                </label>

                <input
                    id="opportunity"
                    type="text"
                    placeholder="Example: Food Pantry Assistant"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe what volunteers will do..."
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="type">
                        Type of Volunteering
                    </label>

                    <select id="type">

                        <option>
                            Food & Hunger
                        </option>

                        <option>
                            Education
                        </option>

                        <option>
                            Environment
                        </option>

                        <option>
                            Animals
                        </option>

                        <option>
                            Community Service
                        </option>

                        <option>
                            Health
                        </option>

                        <option>
                            Disaster Relief
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="age">
                        Recommended Age
                    </label>

                    <select id="age">

                        <option>
                            All Ages
                        </option>

                        <option>
                            Youth
                        </option>

                        <option>
                            Teens
                        </option>

                        <option>
                            Adults
                        </option>

                        <option>
                            Seniors
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        id="location"
                        type="text"
                        placeholder="New York, NY"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Contact Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="organization@email.com"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="requirements">
                    Requirements
                </label>

                <textarea
                    id="requirements"
                    placeholder="Example: No previous experience required..."
                ></textarea>

            </div>


            <button
                class="submit-button"
                type="submit"
            >
                SUBMIT OPPORTUNITY
            </button>

        </form>

    </main>

</div>

</body>

</html>
