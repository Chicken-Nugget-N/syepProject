<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - Volunteer Portal</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .simple-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signin-box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .signin-box h1 {
            color: #287a73;
            margin-bottom: 10px;
        }

        .signin-box p {
            color: #666;
            margin-bottom: 25px;
        }

        .signin-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        .signin-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .signin-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #3d8b70;
            color: white;
            cursor: pointer;
        }

        .signin-box button:hover {
            background: #287a73;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #287a73;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="wrapper">

    <nav>

        <a href="index.html">
            <button>HOME</button>
        </a>

        <a href="about.html">
            <button>ABOUT US</button>
        </a>

        <a href="volunteerform.html">
            <button>PROVIDE VOLUNTEERING</button>
        </a>

        <a href="signin.html">
            <button>SIGN IN</button>
        </a>

    </nav>


    <main class="simple-page">

        <div class="signin-box">

            <h1>Sign In</h1>

            <p>
                Sign in to your Volunteer Portal account.
            </p>

            <form onsubmit="return false;">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                >


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                >


                <button type="submit">
                    SIGN IN
                </button>

            </form>

            <a
                class="back-home"
                href="index.html"
            >
                ← Back to Home
            </a>

        </div>

    </main>

</div>

</body>

</html>
